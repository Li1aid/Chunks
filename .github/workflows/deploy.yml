# 推到 main 就自动:跑测试 → 发布 Worker → 发布网页版(Cloudflare Pages)。
# 需要两个仓库密钥(Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — Cloudflare API 令牌(Workers Scripts / D1 / Pages 编辑权限)
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare 账号 ID
# Worker 的 ANTHROPIC_API_KEY 等密钥保存在 Cloudflare 侧,部署不会覆盖。

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'worker/**'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js tests/static-check.mjs

  deploy-worker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

  deploy-web:
    needs: [test, deploy-worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name chunks-web --branch main --commit-dirty=true
